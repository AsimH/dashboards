<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portfolio Monitor · Pakistan Stock Exchange</title>
<style>
:root{
  --bg:#faf8f3; --card:#fffdf8; --ink:#1f1c17; --muted:#7c7362; --faint:#a89e8b;
  --line:#e7e1d5; --grid:#efeadf; --rust:#b5502e; --slate:#3d5a6c;
  --gain:#2e7d57; --loss:#b5502e;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --shadow:0 1px 2px rgba(31,28,23,.04),0 1px 12px rgba(31,28,23,.03);
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:var(--sans); font-size:16px; line-height:1.45; font-variant-numeric:tabular-nums;
  -webkit-font-smoothing:antialiased; padding:24px 24px 64px;
}
.wrap{max-width:1120px;margin:0 auto}
.up{color:var(--gain)} .down{color:var(--loss)}

/* ---- masthead ---- */
.mast{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.mast h1{font-family:var(--sans);font-weight:600;font-size:36px;line-height:1;margin:0;letter-spacing:.2px}
.mast h1 span{color:var(--rust)}
.mast-tools{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
select#pf{
  font-family:var(--sans);font-size:13px;letter-spacing:.05em;text-transform:uppercase;
  border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:6px;padding:9px 11px;cursor:pointer;
}
.btn{
  font-family:var(--sans);font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;
  border:1px solid var(--ink);background:var(--card);color:var(--ink);border-radius:6px;padding:9px 14px;cursor:pointer;
  display:inline-flex;align-items:center;gap:6px;transition:.12s;
}
.btn:hover{background:var(--ink);color:var(--bg)}
.btn.solid{background:var(--ink);color:var(--bg)}
.btn.solid:hover{background:var(--rust);border-color:var(--rust)}
.btn.ghost{border-color:var(--line);color:var(--muted)}
.btn.ghost:hover{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.rule{height:1.5px;background:var(--ink);margin:13px 0 0}
.sub{display:flex;align-items:center;gap:11px;flex-wrap:wrap;margin-top:11px;color:var(--muted);
  font-family:var(--sans);font-size:13px;letter-spacing:.02em}
.pill{font-family:var(--sans);font-size:12px;letter-spacing:.08em;text-transform:uppercase;
  border:1px solid var(--line);border-radius:999px;padding:4px 10px;color:var(--muted);white-space:nowrap}
.pill.close{border-color:var(--slate);color:var(--slate)}
.pill.sample{border-color:var(--rust);color:var(--rust)}
.pill.live{border-color:var(--gain);color:var(--gain)}
.pill .dot{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:6px;vertical-align:middle;background:currentColor}

/* ---- kpi band ---- */
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow)}
.klabel{font-family:var(--sans);font-size:12.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.kbig{font-family:var(--sans);font-weight:600;font-variant-numeric:tabular-nums;line-height:1}
.khero,.kpl{padding:20px 22px;display:flex;flex-direction:column;justify-content:center;gap:10px}
.khero .kbig{font-size:44px;letter-spacing:-.6px}
.khero .kfoot{font-family:var(--sans);font-size:15px;color:var(--muted)}
.kpl .kbig{font-size:40px;letter-spacing:-.6px}
.kpl .kpct{font-family:var(--sans);font-size:18px;font-weight:500}

/* ---- stats strip ---- */
.strip{display:flex;flex-wrap:wrap;align-items:stretch;margin-top:14px;border:1px solid var(--line);
  border-radius:10px;background:var(--card);box-shadow:var(--shadow);overflow:hidden}
.stat{flex:1 1 auto;min-width:150px;padding:14px 18px;border-right:1px solid var(--grid)}
.stat:last-child{border-right:none}
.stat .s-lab{font-family:var(--sans);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.stat .s-val{font-family:var(--sans);font-size:18px;font-weight:500;margin-top:6px;font-variant-numeric:tabular-nums}
.stat .s-val .tk{font-weight:600}

/* ---- positions ---- */
.pos-head{margin:24px 0 9px}
.pos-head .t{font-family:var(--sans);font-size:24px;font-weight:600}
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);
  border-radius:10px;overflow:hidden;box-shadow:var(--shadow)}
thead th{font-family:var(--sans);font-size:12px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--muted);font-weight:500;text-align:right;padding:13px 15px;border-bottom:1.5px solid var(--ink);
  cursor:pointer;user-select:none;white-space:nowrap;background:var(--card)}
thead th:first-child{text-align:left}
thead th.noSort{cursor:default}
thead th .arw{color:var(--rust);margin-left:3px}
tbody td{padding:13px 15px;border-bottom:1px solid var(--grid);text-align:right;
  font-family:var(--sans);font-size:16px;font-variant-numeric:tabular-nums;white-space:nowrap}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover{background:#fbf8f1}
td.sym{text-align:left}
td.sym .tk{font-weight:600;font-size:17px}
td.sym .nm{font-family:var(--sans);font-size:13.5px;color:var(--faint);letter-spacing:0;
  max-width:230px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px}
.plcell{display:inline-flex;flex-direction:column;align-items:flex-end;gap:4px}
.microbar{width:60px;height:4px;border-radius:2px;background:var(--grid);position:relative;overflow:hidden}
.microbar i{position:absolute;top:0;bottom:0}
.act{display:inline-flex;gap:5px}
.iconbtn{border:1px solid var(--line);background:var(--card);border-radius:5px;width:30px;height:28px;cursor:pointer;
  color:var(--muted);font-size:14px;display:inline-flex;align-items:center;justify-content:center;transition:.1s;padding:0}
.iconbtn:hover{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.iconbtn.del:hover{background:var(--rust);border-color:var(--rust)}
tr.editing{background:#fbf6ec}
tr.editing input{width:92px;font-family:var(--sans);font-size:15px;text-align:right;
  border:1px solid var(--slate);border-radius:5px;padding:6px 8px;background:#fff}
.stale{color:var(--faint)}
.missing{color:var(--rust);font-size:12.5px;letter-spacing:.03em}

/* ---- add form ---- */
.addwrap{margin-top:12px;border:1px dashed var(--line);border-radius:10px;background:var(--card)}
.addbar{display:flex;align-items:center;justify-content:space-between;padding:13px 17px;cursor:pointer}
.addbar .t{font-family:var(--sans);font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.addbar .chev{color:var(--muted);transition:.2s;font-size:14px}
.addwrap.open .chev{transform:rotate(180deg)}
.addbody{display:none;padding:0 17px 17px;gap:13px;flex-wrap:wrap;align-items:flex-end}
.addwrap.open .addbody{display:flex}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-family:var(--sans);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.field input{font-family:var(--sans);font-size:15px;border:1px solid var(--line);border-radius:6px;
  padding:10px 12px;background:#fff;color:var(--ink);width:140px}
.field input:focus{outline:none;border-color:var(--slate)}
.field.sym-f input{width:160px;text-transform:uppercase}
.symhint{font-family:var(--sans);font-size:12.5px;color:var(--muted);min-height:15px;margin-top:2px;max-width:170px}
.symhint.bad{color:var(--rust)}

.foot{margin-top:26px;color:var(--faint);font-family:var(--sans);font-size:12.5px;line-height:1.8;letter-spacing:.01em}
.foot b{color:var(--muted);font-weight:500}
input[type=file]{display:none}

@media(max-width:720px){
  .kpis{grid-template-columns:1fr}
  .mast h1{font-size:28px}
  td.sym .nm{display:none}
  thead th.hide,tbody td.hide{display:none}
}
</style>
</head>
<body>
<div class="wrap">

  <div class="mast">
    <div><h1>Portfolio Monitor <span>·</span> PSX</h1></div>
    <div class="mast-tools">
      <select id="pf" title="Portfolio"></select>
      <button class="btn ghost" id="addPfBtn" title="New portfolio">+ New</button>
      <label class="btn" for="fileInput">↑ Upload PSX file</label>
      <input type="file" id="fileInput" accept=".txt,.csv,.zip">
    </div>
  </div>
  <div class="rule"></div>
  <div class="sub">
    <span id="asofLine">Symbol Price (Upper / Lower) · last-day close</span>
    <span class="pill close" id="closePill"><span class="dot"></span>PSX CLOSE</span>
    <span class="pill" id="countPill">0 POSITIONS</span>
  </div>

  <!-- KPI band -->
  <div class="kpis">
    <div class="card khero">
      <div class="klabel">Portfolio value</div>
      <div class="kbig" id="kValue">Rs 0</div>
      <div class="kfoot" id="kInvested">Invested Rs 0</div>
    </div>
    <div class="card kpl">
      <div class="klabel">Unrealized P / L</div>
      <div class="kbig" id="kPL">Rs 0</div>
      <div class="kpct" id="kPLpct">0.00%</div>
    </div>
  </div>

  <!-- stats strip -->
  <div class="strip" id="strip"></div>

  <!-- positions -->
  <div class="pos-head"><div class="t">Positions</div></div>
  <table id="tbl">
    <thead><tr id="thr"></tr></thead>
    <tbody id="tbody"></tbody>
  </table>

  <!-- add -->
  <div class="addwrap" id="addWrap">
    <div class="addbar" id="addBar">
      <span class="t">+ Add position</span>
      <span class="chev">▾</span>
    </div>
    <div class="addbody">
      <div class="field sym-f">
        <label>Symbol</label>
        <input id="fSym" placeholder="OGDC" autocomplete="off">
        <div class="symhint" id="symHint"></div>
      </div>
      <div class="field">
        <label>Shares</label>
        <input id="fShares" type="number" min="0" placeholder="100">
      </div>
      <div class="field">
        <label>Purchase price (Rs)</label>
        <input id="fCost" type="number" min="0" step="0.01" placeholder="0.00">
      </div>
      <button class="btn solid" id="addPosBtn" style="height:42px">Add position</button>
    </div>
  </div>

  <div class="foot" id="foot"></div>

</div>

ation Limited","TRG":"TRG Pakistan Limited","TRIBL":"Trust Investment Bank Limited(DEF)","TRIPF":"Tri-Pack Films Limited","TRSM":"Trust Modaraba","TSBL":"Trust Securities & Brokerage Limited","TSMF":"Tri-Star Mutual Fund Limited","TSML":"Tandlianwala Sugar Mills Limited","TSPL":"Tri-Star Power Limited","UBDL":"United Brands Limited","UBL":"United Bank Limited","UBLPETF":"UBLPakistan Enterprise ETF(XD)","UCAPM":"Unicap Modaraba","UDLI":"UDL International Limited","UDPL":"United Distributors Pakistan Limited","UNIC":"The United Insurance Company","UNITY":"Unity Foods Limited","UPFL":"Unilever Pakistan Foods Limited","USMT":"Usman Textile Mills Limited(DEF)","UVIC":"The Universal Insurance Company Limited","WAFI":"Wafi Energy Pakistan Limited","WAHDAT":"Wahdat Poultry Farm Limited","WAHN":"Wah Noble Chemicals Limited","WASL":"Wasl Mobility Modaraba","WAVES":"Waves Corporation Limited","WAVESAPP":"Waves Home Appliances Limited","WTL":"Worldcall Telecom Limited","YOUW":"Yousaf Weaving Mills Limited","ZAHID":"Zahidjee Textile Mills Limited","ZAL":"Zarea Limited","ZELP":"Zeal Pak Cement Factory Limited(DEF)","ZIL":"ZIL Limited","ZTL":"Zephyr Textiles Limited","ZUMA":"Zuma Resources Limited"};


/* ============================ state ============================ */
let ASOF="09 Jul 2026";                    // overwritten by prices.json when present
let FEED="sample";                         // 'live' once prices.json loads, else 'sample'
let FEEDNOTE="sample file · 09 Jul 2026";
let PRICES=Object.assign({},PSX_CLOSE);
let NAMES =Object.assign({},PSX_NAME);

const SEED={"Aunty":[]};   // public deploy: book lives in localStorage, never committed

const LS_BOOK="psx_books_v1";
let books=load(LS_BOOK,SEED);
let current=Object.keys(books)[0]||"Aunty";
let sortKey="weight", sortDir=-1;

function load(k,d){ try{const v=JSON.parse(localStorage.getItem(k)); return v||d;}catch(e){return d;} }
function save(){ localStorage.setItem(LS_BOOK,JSON.stringify(books)); }

/* ============================ format ============================ */
const nf0=new Intl.NumberFormat('en-US',{maximumFractionDigits:0});
const nf2=new Intl.NumberFormat('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const MIN='\u2212';
const money0=x=>'Rs '+nf0.format(Math.round(x));
const signed=x=>(x>=0?'+':MIN)+'Rs '+nf0.format(Math.abs(Math.round(x)));
const pctS  =(x,d=2)=>(x>=0?'+':MIN)+Math.abs(x).toFixed(d)+'%';
const price =x=>nf2.format(x);

/* ============================ compute ============================ */
function rows(){
  const b=books[current]||[];
  let totMV=0,totCost=0;
  const rs=b.map(p=>{
    const last=PRICES[p.sym];
    const has=last!=null;
    const mv=has?p.shares*last:0;
    const cost=p.shares*p.cost;
    const pl=has?mv-cost:0;
    const plpct=cost>0&&has?pl/cost*100:0;
    totMV+=mv; totCost+=cost;
    return {...p,last,has,mv,cost,pl,plpct,name:NAMES[p.sym]||''};
  });
  rs.forEach(r=>r.weight=totMV>0?r.mv/totMV*100:0);
  return {rs,totMV,totCost,totPL:totMV-totCost,totPLpct:totCost>0?(totMV-totCost)/totCost*100:0};
}

/* ============================ render ============================ */
const COLS=[
  {k:"sym",   t:"Symbol",   cls:"sym"},
  {k:"shares",t:"Shares",   cls:""},
  {k:"cost",  t:"Purchase price", cls:"hide"},
  {k:"last",  t:"Last",     cls:""},
  {k:"mv",    t:"Mkt value",cls:""},
  {k:"pl",    t:"P / L",    cls:""},
  {k:"plpct", t:"P / L %",  cls:""},
  {k:"weight",t:"Weight",   cls:"hide"},
  {k:"act",   t:"",         noSort:true, cls:"noSort"}
];

function render(){
  const {rs,totMV,totCost,totPL,totPLpct}=rows();

  document.getElementById('countPill').textContent=rs.length+' POSITION'+(rs.length===1?'':'S');
  const cp=document.getElementById('closePill');
  cp.className='pill '+(FEED==='live'?'live':'close');
  cp.innerHTML='<span class="dot"></span>PSX CLOSE · '+ASOF.toUpperCase()+(FEED==='live'?'':' · SAMPLE');
  document.getElementById('asofLine').textContent='Symbol Price (Upper / Lower) · '+FEEDNOTE;

  document.getElementById('kValue').textContent=money0(totMV);
  document.getElementById('kInvested').textContent='Invested '+money0(totCost);
  const plEl=document.getElementById('kPL'),pctEl=document.getElementById('kPLpct');
  plEl.textContent=signed(totPL); plEl.className='kbig '+(totPL>=0?'up':'down');
  pctEl.textContent=pctS(totPLpct); pctEl.className='kpct '+(totPL>=0?'up':'down');

  renderStrip(rs);
  renderHead();
  renderBody(rs);
  renderPfSelect();

  document.getElementById('foot').innerHTML=
    '<b>Prices</b> — last-day close from the PSX “Symbol Price (Upper / Lower)” file (REG segment), '+ASOF+'. '+
    (FEED==='live'
      ? 'Loaded from <b>prices.json</b>, refreshed by the daily job.'
      : 'Showing the embedded <span style="color:var(--rust)">sample</span> — publish <b>prices.json</b> beside this page (or upload a file) to go live.')+
    '<br><b>Refresh</b> — the daily GitHub Action rebuilds prices.json from the PSX download; this page reads it on load. '+
    'You can also drop a file in manually with <b>Upload PSX file</b>.';
  save();
}

function renderStrip(rs){
  const priced=rs.filter(r=>r.has);
  const win=priced.filter(r=>r.pl>0).length,los=priced.filter(r=>r.pl<0).length;
  const byW=[...priced].sort((a,b)=>b.weight-a.weight);
  const byP=[...priced].sort((a,b)=>b.plpct-a.plpct);
  const top=byW[0],top3=byW.slice(0,3).reduce((s,r)=>s+r.weight,0);
  const best=byP[0],worst=byP[byP.length-1];
  const cell=(lab,val)=>'<div class="stat"><div class="s-lab">'+lab+'</div><div class="s-val">'+val+'</div></div>';
  const tk=(s,x='')=>'<span class="tk">'+s+'</span> '+x;
  document.getElementById('strip').innerHTML= priced.length?(
    cell('Winners / Losers','<span class="up">'+win+'</span> / <span class="down">'+los+'</span>')+
    cell('Top holding', top?tk(top.sym,top.weight.toFixed(1)+'%'):'—')+
    cell('Top-3 concentration', top3.toFixed(1)+'%')+
    cell('Best performer', best?tk(best.sym,'<span class="up">'+pctS(best.plpct,1)+'</span>'):'—')+
    cell('Worst performer', worst?tk(worst.sym,'<span class="down">'+pctS(worst.plpct,1)+'</span>'):'—')
  ):cell('Book','no priced positions');
}

function renderHead(){
  const thr=document.getElementById('thr'); thr.innerHTML='';
  COLS.forEach(c=>{
    const th=document.createElement('th');
    th.className=(c.cls||'')+(c.noSort?' noSort':'');
    th.innerHTML=c.t+(sortKey===c.k&&!c.noSort?'<span class="arw">'+(sortDir<0?'▼':'▲')+'</span>':'');
    if(!c.noSort) th.onclick=()=>{ if(sortKey===c.k)sortDir*=-1; else{sortKey=c.k;sortDir=(c.k==='sym')?1:-1;} render(); };
    thr.appendChild(th);
  });
}

function renderBody(rs){
  const sorted=[...rs].sort((a,b)=>{
    if(sortKey==='sym') return a.sym<b.sym?-sortDir:a.sym>b.sym?sortDir:0;
    return (a[sortKey]-b[sortKey])*sortDir;
  });
  const tb=document.getElementById('tbody'); tb.innerHTML='';
  sorted.forEach(r=>{
    const idx=books[current].findIndex(p=>p.sym===r.sym);
    const tr=document.createElement('tr'); tr.dataset.idx=idx;
    const plCls=r.pl>0?'up':r.pl<0?'down':'';
    const barW=Math.min(50,Math.abs(r.plpct)/2);
    const bar='<div class="microbar"><i style="'+(r.plpct>=0?'left:50%;background:var(--gain)':'right:50%;background:var(--loss)')+';width:'+barW+'%"></i></div>';
    tr.innerHTML=
      '<td class="sym"><div class="tk">'+r.sym+'</div><div class="nm">'+(r.name||'')+'</div></td>'+
      '<td>'+nf0.format(r.shares)+'</td>'+
      '<td class="hide">'+price(r.cost)+'</td>'+
      '<td>'+(r.has?price(r.last):'<span class="missing">no price</span>')+'</td>'+
      '<td>'+(r.has?money0(r.mv):'<span class="stale">—</span>')+'</td>'+
      '<td class="'+plCls+'">'+(r.has?signed(r.pl):'<span class="stale">—</span>')+'</td>'+
      '<td class="'+plCls+'"><div class="plcell">'+(r.has?pctS(r.plpct):'<span class="stale">—</span>')+bar+'</div></td>'+
      '<td class="hide">'+r.weight.toFixed(1)+'%</td>'+
      '<td><div class="act">'+
        '<button class="iconbtn" title="Edit" onclick="editRow('+idx+')">✎</button>'+
        '<button class="iconbtn del" title="Delete" onclick="delRow('+idx+')">✕</button>'+
      '</div></td>';
    tb.appendChild(tr);
  });
}

/* ============================ edit / add / delete ============================ */
function editRow(idx){
  const p=books[current][idx];
  const tr=document.querySelector('tr[data-idx="'+idx+'"]'); if(!tr) return;
  tr.classList.add('editing');
  const t=tr.children;
  t[1].innerHTML='<input id="e_sh" type="number" value="'+p.shares+'">';
  t[2].classList.remove('hide'); t[2].innerHTML='<input id="e_ct" type="number" step="0.01" value="'+p.cost+'">';
  t[8].innerHTML='<div class="act"><button class="iconbtn" title="Save" onclick="saveRow('+idx+')">✓</button>'+
                 '<button class="iconbtn del" title="Cancel" onclick="render()">✕</button></div>';
}
function saveRow(idx){
  const sh=parseFloat(document.getElementById('e_sh').value);
  const ct=parseFloat(document.getElementById('e_ct').value);
  if(!(sh>0)||!(ct>=0)) return;
  books[current][idx].shares=sh; books[current][idx].cost=ct; render();
}
function delRow(idx){
  const p=books[current][idx];
  if(!confirm('Remove '+p.sym+' from '+current+'?')) return;
  books[current].splice(idx,1); render();
}
function addPosition(){
  const sym=document.getElementById('fSym').value.trim().toUpperCase();
  const sh=parseFloat(document.getElementById('fShares').value);
  const ct=parseFloat(document.getElementById('fCost').value);
  if(!sym||!(sh>0)||!(ct>=0)){ hint('Enter symbol, shares and purchase price.',true); return; }
  const ex=books[current].find(p=>p.sym===sym);
  if(ex){ const tot=ex.shares+sh; ex.cost=(ex.shares*ex.cost+sh*ct)/tot; ex.shares=tot; }
  else books[current].push({sym,shares:sh,cost:ct});
  document.getElementById('fSym').value=''; document.getElementById('fShares').value=''; document.getElementById('fCost').value='';
  hint(''); render();
}
function hint(msg,bad){ const h=document.getElementById('symHint'); h.textContent=msg; h.className='symhint'+(bad?' bad':''); }

/* ============================ portfolios ============================ */
function renderPfSelect(){
  const sel=document.getElementById('pf'); sel.innerHTML='';
  Object.keys(books).forEach(k=>{
    const o=document.createElement('option'); o.value=k; o.textContent=k; if(k===current)o.selected=true; sel.appendChild(o);
  });
}

/* ============================ PSX file parse (manual upload) ============================ */
function parsePSX(text){
  const map={},nm={}; let n=0;
  for(const r of text.split(/[\r\n]+/)){
    if(r.indexOf("'REG'")!==0) continue;
    const m=r.match(/^'REG','([^']+)','(.*)','[^']+',([\d.]+),([\d.]+),([\d.]+)$/);
    if(!m) continue;
    map[m[1]]=parseFloat(m[5]); nm[m[1]]=m[2]; n++;
  }
  return {map,nm,n};
}
function dateFromName(fn){
  const m=fn.match(/(\d{4})(\d{2})([a-z]{3})/i);
  if(!m) return null;
  return m[2]+' '+m[3].charAt(0).toUpperCase()+m[3].slice(1).toLowerCase()+' '+m[1];
}

/* ============================ prices.json (auto feed) ============================ */
async function loadFeed(){
  try{
    const r=await fetch('prices.json',{cache:'no-store'});
    if(!r.ok) return false;
    const j=await r.json();
    if(!j||!j.prices||Object.keys(j.prices).length<50) return false;
    PRICES=j.prices; NAMES=Object.assign({},NAMES,j.names||{});
    ASOF=j.as_of_label||ASOF; FEED='live';
    FEEDNOTE=(j.count||Object.keys(j.prices).length)+' symbols · '+ASOF+' · auto-updated';
    return true;
  }catch(e){ return false; }   // file:// or not published yet -> keep embedded sample
}

/* ============================ events ============================ */
document.getElementById('pf').onchange=e=>{ current=e.target.value; sortKey="weight"; sortDir=-1; render(); };
document.getElementById('addPfBtn').onclick=()=>{
  const name=prompt('New portfolio name'); if(!name) return;
  if(books[name]){alert('Already exists');return;}
  books[name]=[]; current=name; render();
};
document.getElementById('addBar').onclick=()=>document.getElementById('addWrap').classList.toggle('open');
document.getElementById('addPosBtn').onclick=addPosition;
document.getElementById('fSym').addEventListener('input',e=>{
  const s=e.target.value.trim().toUpperCase();
  if(!s){hint('');return;}
  if(PRICES[s]!=null) hint((NAMES[s]||s)+' · last '+price(PRICES[s]));
  else hint('Not in current close file — you can still add it.',true);
});
document.getElementById('fileInput').addEventListener('change',ev=>{
  const f=ev.target.files[0]; if(!f) return;
  const rd=new FileReader();
  rd.onload=()=>{
    const {map,nm,n}=parsePSX(rd.result);
    if(n<10){ alert('That doesn’t look like a PSX Symbol-Price file (found '+n+' REG rows).'); return; }
    PRICES=map; NAMES=Object.assign({},NAMES,nm);
    const d=dateFromName(f.name); if(d) ASOF=d;
    FEED='live'; FEEDNOTE=n+' symbols · '+ASOF+' · uploaded';
    render();
  };
  rd.readAsText(f);   // note: for .zip, unzip first or use the daily job
  ev.target.value='';
});

/* boot: try the feed, then render */
(async()=>{ await loadFeed(); render(); })();
</script>
